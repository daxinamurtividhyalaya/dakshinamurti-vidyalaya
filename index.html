<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ગૃહકાર્ય જનરેટર | દક્ષિણામૂર્તિ વિદ્યાલય</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@500;600;700;800&family=Noto+Sans+Gujarati:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0b2c54;
    --navy:#123a6b;
    --navy-light:#1e4f8f;
    --gold:#c9a227;
    --gold-light:#e8c96a;
    --gold-pale:#fbf1d6;
    --cream:#fffdf8;
    --paper:#f6f3ea;
    --ink:#1c2a3a;
    --muted:#66738a;
    --red:#b23b3b;
    --radius:16px;
    --shadow: 0 10px 30px rgba(11,44,84,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Noto Sans Gujarati','Baloo Bhai 2',sans-serif;
    background:
      radial-gradient(1200px 600px at 10% -10%, #eaf0fb 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, #fdf3da 0%, transparent 50%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:22px 14px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}

  /* ---------- App header ---------- */
  .app-header{
    display:flex;align-items:center;gap:14px;
    margin-bottom:22px;
  }
  .app-header img{width:54px;height:54px;object-fit:contain;flex-shrink:0;}
  .app-header .titles h1{
    margin:0;font-family:'Baloo Bhai 2';font-size:22px;color:var(--navy-deep);
    letter-spacing:.3px;
  }
  .app-header .titles p{
    margin:2px 0 0;font-size:13px;color:var(--muted);
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--cream);
    border-radius:20px;
    box-shadow:var(--shadow);
    border:1px solid #e8e2cf;
    padding:22px;
    margin-bottom:20px;
  }
  .card h2{
    font-family:'Baloo Bhai 2';
    font-size:17px;
    color:var(--navy-deep);
    margin:0 0 16px;
    display:flex;align-items:center;gap:8px;
  }
  .card h2::before{
    content:"";
    width:6px;height:18px;border-radius:4px;
    background:linear-gradient(180deg,var(--gold),var(--gold-light));
    display:inline-block;
  }

  label{
    font-size:13.5px;font-weight:600;color:var(--navy);
    display:block;margin-bottom:6px;
  }
  select, input[type=date], textarea{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid #dcd6c2;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border .15s, box-shadow .15s;
  }
  input[readonly]{
    width:100%;
    font-family:inherit;
    font-size:15px;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid #dcd6c2;
    background:#f6f3ea !important;
    color:var(--navy) !important;
    -webkit-text-fill-color:var(--navy);
    opacity:1 !important;
    outline:none;
    caret-color:transparent;
    font-weight:600;
  }
  select:focus, input:focus, textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,39,0.18);
  }
  textarea{resize:vertical;min-height:64px;line-height:1.5;}

  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}

  .subject-row{
    border:1.5px dashed #d8cf9f;
    border-radius:14px;
    padding:14px;
    margin-bottom:12px;
    background:#fffefb;
    position:relative;
  }
  .subject-row .subject-top{
    display:flex;gap:10px;align-items:center;margin-bottom:10px;
  }
  .subject-row .subject-top select{flex:1;}
  .remove-btn{
    background:#f6e3e3;color:var(--red);border:none;
    width:38px;height:38px;border-radius:10px;font-size:18px;
    cursor:pointer;flex-shrink:0;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .remove-btn:hover{background:#f0caca;}

  .add-subject-btn{
    width:100%;padding:12px;border-radius:12px;
    border:1.5px solid var(--navy-light);
    background:#fff;color:var(--navy);
    font-weight:700;font-size:14.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s;
  }
  .add-subject-btn:hover{background:#eef4fc;}

  .quote-box{
    display:flex;align-items:center;gap:10px;
    background:var(--gold-pale);
    border:1px solid #ecd99a;
    border-radius:12px;
    padding:12px 14px;
    font-size:14.5px;color:var(--navy-deep);
    font-weight:600;
  }
  .quote-box .quote-text{flex:1;}
  .shuffle-btn{
    background:var(--navy);color:#fff;border:none;
    width:34px;height:34px;border-radius:8px;cursor:pointer;
    flex-shrink:0;font-size:15px;
    display:flex;align-items:center;justify-content:center;
  }
  .shuffle-btn:hover{background:var(--navy-light);}

  .generate-btn{
    width:100%;padding:16px;border:none;border-radius:14px;
    background:linear-gradient(135deg,var(--navy-deep),var(--navy-light));
    color:#fff;font-size:17px;font-weight:700;
    font-family:'Baloo Bhai 2';letter-spacing:.4px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(18,58,107,0.35);
    display:flex;align-items:center;justify-content:center;gap:10px;
  }
  .generate-btn:active{transform:translateY(1px);}
  .generate-btn:disabled{opacity:.6;cursor:not-allowed;}

  .hint{font-size:12px;color:var(--muted);margin-top:6px;}

  /* ---------- Preview overlay ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(11,20,35,0.72);
    display:none;align-items:flex-start;justify-content:center;
    z-index:100;padding:20px 12px;overflow-y:auto;
  }
  .overlay.active{display:flex;}
  .preview-panel{
    background:#fff;border-radius:18px;max-width:560px;width:100%;
    padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .preview-panel h3{
    font-family:'Baloo Bhai 2';color:var(--navy-deep);margin:0 0 12px;
    font-size:17px;text-align:center;
  }
  .preview-img-wrap{
    border-radius:12px;overflow:hidden;border:1px solid #eee;
    max-height:65vh;overflow-y:auto;background:#f2f2f2;
  }
  .preview-img-wrap img{width:100%;display:block;}
  .preview-actions{
    display:flex;gap:10px;margin-top:16px;
  }
  .preview-actions button{
    flex:1;padding:13px;border-radius:12px;border:none;
    font-weight:700;font-size:14.5px;cursor:pointer;
    font-family:'Baloo Bhai 2';
  }
  .btn-edit{background:#eee;color:#333;}
  .btn-edit:hover{background:#e2e2e2;}
  .btn-download{
    background:linear-gradient(135deg,var(--gold),#b8901f);color:#fff;
  }
  .btn-download:hover{filter:brightness(1.05);}

  .loading-msg{
    text-align:center;color:var(--navy);font-weight:600;font-size:14px;padding:30px 0;
  }

  footer.made{
    text-align:center;color:var(--muted);font-size:12px;margin-top:10px;
  }

  @media (max-width:520px){
    .row3{grid-template-columns:1fr;}
    .app-header .titles h1{font-size:19px;}
    .card{padding:16px;}
    .preview-actions{flex-direction:column;}
  }
</style>
</head>

function dayOfYear(d){
  const start = new Date(d.getFullYear(),0,0);
  const diff = d - start;
  return Math.floor(diff / 86400000);
}

let quoteOverrideIndex = null;

function currentQuote(){
  const d = new Date(dateInput.value || new Date());
  const base = dayOfYear(d) % QUOTES.length;
  const idx = quoteOverrideIndex!==null ? quoteOverrideIndex : base;
  return QUOTES[idx];
}

/* ================= Init ================= */
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
dateInput.value = todayStr();

function updateDay(){
  const d = new Date(dateInput.value);
  if(isNaN(d.getTime())){ dayDisplay.value=""; return; }
  dayDisplay.value = DAY_NAMES[d.getDay()];
}
dateInput.addEventListener('change', ()=>{ updateDay(); refreshQuoteText(); });
updateDay();

function refreshQuoteText(){
  quoteOverrideIndex = null;
  quoteDisplay.textContent = currentQuote();
}
refreshQuoteText();
shuffleBtn.addEventListener('click', ()=>{
  let idx;
  do{ idx = Math.floor(Math.random()*QUOTES.length); }while(QUOTES[idx]===quoteDisplay.textContent && QUOTES.length>1);
  quoteOverrideIndex = idx;
  quoteDisplay.textContent = QUOTES[idx];
});

/* subject rows */
function buildSubjectOptions(std){
  const grp = groupForStandard(std);
  if(!grp) return '<option value="">પહેલા ધોરણ પસંદ કરો</option>';
  let html = '<option value="">-- વિષય પસંદ કરો --</option>';
  SUBJECTS_BY_GROUP[grp].forEach(s=>{ html += `<option value="${s}">${s}</option>`; });
  return html;
}

function addSubjectRow(){
  const row = document.createElement('div');
  row.className = 'subject-row';
  row.innerHTML = `
    <div class="subject-top">
      <select class="subjectSelect">${buildSubjectOptions(standardSelect.value)}</select>
      <button type="button" class="remove-btn" title="દૂર કરો">✕</button>
    </div>
    <textarea class="subjectText" placeholder="અહીં ગૃહકાર્ય લખો..."></textarea>
  `;
  row.querySelector('.remove-btn').addEventListener('click', ()=>{
    if(subjectsContainer.children.length>1){ row.remove(); }
  });
  subjectsContainer.appendChild(row);
}

standardSelect.addEventListener('change', ()=>{
  document.querySelectorAll('.subjectSelect').forEach(sel=>{
    const prev = sel.value;
    sel.innerHTML = buildSubjectOptions(standardSelect.value);
    if([...sel.options].some(o=>o.value===prev)) sel.value = prev;
  });
});

/* ================= Canvas helpers ================= */
function roundRectPath(ctx,x,y,w,h,r){
  if(typeof r === 'number') r = {tl:r,tr:r,br:r,bl:r};
  ctx.beginPath();
  ctx.moveTo(x+r.tl,y);
  ctx.lineTo(x+w-r.tr,y);
  ctx.arcTo(x+w,y,x+w,y+r.tr,r.tr);
  ctx.lineTo(x+w,y+h-r.br);
  ctx.arcTo(x+w,y+h,x+w-r.br,y+h,r.br);
  ctx.lineTo(x+r.bl,y+h);
  ctx.arcTo(x,y+h,x,y+h-r.bl,r.bl);
  ctx.lineTo(x,y+r.tl);
  ctx.arcTo(x,y,x+r.tl,y,r.tl);
  ctx.closePath();
}

function wrapText(ctx, text, maxWidth){
  const paragraphs = String(text||'').split('\n');
  let lines = [];
  paragraphs.forEach(p=>{
    if(p.trim()===''){ lines.push(''); return; }
    const words = p.split(' ');
    let current = '';
    words.forEach(w=>{
      const test = current ? current+' '+w : w;
      if(ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    });
    if(current) lines.push(current);
  });
  if(lines.length===0) lines.push('');
  return lines;
}

function iconCalendar(ctx,cx,cy,s,color){
  const w=s, h=s*0.85;
  const x=cx-w/2, y=cy-h/2+s*0.08;
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=s*0.07;
  roundRectPath(ctx,x,y,w,h,s*0.14);
  ctx.stroke();
  ctx.save();
  roundRectPath(ctx,x,y,w,h*0.3,{tl:s*0.14,tr:s*0.14,br:0,bl:0});
  ctx.clip();
  ctx.fillRect(x,y,w,h*0.3);
  ctx.restore();
  for(let r=0;r<2;r++){
    for(let c=0;c<3;c++){
      ctx.beginPath();
      ctx.arc(x+w*0.22+c*w*0.28, y+h*0.55+r*h*0.26, s*0.05,0,Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

  ctx.beginPath(); ctx.arc(cx,cy,s*0.42,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx, cy-s*0.24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+s*0.2, cy+s*0.06); ctx.stroke();

}

function iconBell(ctx,cx,cy,s,color){
  ctx.save();

  ctx.beginPath();

  ctx.lineTo(cx+s*0.36, cy+s*0.2);
  ctx.lineTo(cx-s*0.36, cy+s*0.2);
  ctx.closePath();

  ctx.beginPath(); ctx.arc(cx, cy+s*0.3, s*0.08,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function iconFlask(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=s*0.07; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();
  ctx.moveTo(cx-s*0.1, cy-s*0.34);
  ctx.lineTo(cx-s*0.1, cy-s*0.02);
  ctx.lineTo(cx-s*0.38, cy+s*0.28);
  ctx.quadraticCurveTo(cx-s*0.4, cy+s*0.38, cx-s*0.28, cy+s*0.38);
  ctx.lineTo(cx+s*0.28, cy+s*0.38);
  ctx.quadraticCurveTo(cx+s*0.4, cy+s*0.38, cx+s*0.38, cy+s*0.28);
  ctx.lineTo(cx+s*0.1, cy-s*0.02);
  ctx.lineTo(cx+s*0.1, cy-s*0.34);
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.18,cy-s*0.34); ctx.lineTo(cx+s*0.18,cy-s*0.34); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx-s*0.28, cy+s*0.16);
  ctx.lineTo(cx+s*0.28, cy+s*0.16);
  ctx.lineTo(cx+s*0.35, cy+s*0.3);
  ctx.quadraticCurveTo(cx+s*0.37, cy+s*0.36, cx+s*0.28, cy+s*0.36);
  ctx.lineTo(cx-s*0.28, cy+s*0.36);
  ctx.quadraticCurveTo(cx-s*0.37, cy+s*0.36, cx-s*0.35, cy+s*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
function iconGlobe(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=s*0.055;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.38,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cx,cy,s*0.17,s*0.38,0,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.38,cy); ctx.lineTo(cx+s*0.38,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.32,cy-s*0.2); ctx.lineTo(cx+s*0.32,cy-s*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.32,cy+s*0.2); ctx.lineTo(cx+s*0.32,cy+s*0.2); ctx.stroke();
  ctx.restore();
}
function iconPalette(ctx,cx,cy,s,color){
  ctx.save();
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.ellipse(cx, cy, s*0.42, s*0.32, -0.15, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#fffdf8';
  ctx.beginPath(); ctx.ellipse(cx+s*0.1, cy+s*0.1, s*0.14, s*0.11, 0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=color;
  const dots=[[-0.2,-0.14],[0.02,-0.24],[0.22,-0.12],[-0.24,0.1]];
  dots.forEach(([dx,dy])=>{ ctx.beginPath(); ctx.arc(cx+dx*s, cy+dy*s, s*0.05,0,Math.PI*2); ctx.fill(); });
  ctx.restore();
}
function iconScissors(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=s*0.07; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(cx-s*0.22, cy+s*0.24, s*0.12, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(cx+s*0.22, cy+s*0.24, s*0.12, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.14,cy+s*0.16); ctx.lineTo(cx+s*0.36,cy-s*0.32); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+s*0.14,cy+s*0.16); ctx.lineTo(cx-s*0.36,cy-s*0.32); ctx.stroke();
  ctx.restore();
}
function iconComputer(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=s*0.06;
  roundRectPath(ctx, cx-s*0.4, cy-s*0.3, s*0.8, s*0.5, s*0.06);
  ctx.stroke();
  ctx.fillRect(cx-s*0.16, cy+s*0.22, s*0.32, s*0.07);
  ctx.fillRect(cx-s*0.26, cy+s*0.3, s*0.52, s*0.06);
  ctx.restore();
}
function iconBall(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=s*0.05;
  ctx.beginPath(); ctx.arc(cx,cy,s*0.38,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.3,cy-s*0.15); ctx.lineTo(cx+s*0.3,cy-s*0.15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-s*0.24,cy+s*0.2); ctx.lineTo(cx+s*0.24,cy+s*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,cy-s*0.38); ctx.lineTo(cx,cy+s*0.38); ctx.stroke();
  ctx.restore();
}
function iconDocument(ctx,cx,cy,s,color){
  ctx.save();
  ctx.strokeStyle=color; ctx.lineWidth=s*0.06; ctx.lineJoin='round';
  roundRectPath(ctx, cx-s*0.3, cy-s*0.38, s*0.6, s*0.76, s*0.06);
  ctx.stroke();
  ctx.lineWidth=s*0.045;
  [-0.1,0.06,0.22].forEach(dy=>{
    ctx.beginPath(); ctx.moveTo(cx-s*0.18, cy+dy*s); ctx.lineTo(cx+s*0.18, cy+dy*s); ctx.stroke();
  });
  ctx.restore();
}

function subjectIconFn(name){
  const n = (name||'').toLowerCase();
  if(/ગણિત|math|account|stat/.test(n)) return iconMath;
  if(/વિજ્ઞાન|science/.test(n)) return iconFlask;
  if(/સામાન્ય જ્ઞાન|આસપાસ|સમાજ|s\.p|eco/.test(n)) return iconGlobe;
  if(/ચિત્ર|draw|art/.test(n)) return iconPalette;
  if(/હસ્તકળા|craft/.test(n)) return iconScissors;
  if(/કમ્પ્યુટર|computer/.test(n)) return iconComputer;
  if(/p\.t\.|pt/.test(n)) return iconBall;
  if(/b\.a\./.test(n)) return iconDocument;
  return iconBook; // languages: ગુજરાતી, હિન્દી, English, સંસ્કૃત, etc.
}


async function loadImage(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
async function ensureFonts(){
  // Load fonts WITH the actual Gujarati text we'll render — without this,
  // some browsers (notably iOS Safari) only fetch the default Latin subset
  // and silently fall back to a system font for Gujarati glyphs, which
  // throws off text measurements and causes overlapping/misaligned output.
  const sampleText = 'ગૃહકાર્ય આજનું દક્ષિણામૂર્તિ વિદ્યાલય સા વિદ્યા યા વિમુક્તયે ' +
    '૨૫ વર્ષ નો વિશ્વાસ શિક્ષણ સંસ્કાર શિસ્ત સફળતા તારીખ વાર ધોરણ નોંધ ' +
    'ગુજરાતી હિન્દી ગણિત વિજ્ઞાન સંસ્કૃત કમ્પ્યુટર સામાન્ય જ્ઞાન ચિત્ર આસપાસ સમાજ હસ્તકળા 0123456789';
  const specs = [
    '400 28px "Noto Sans Gujarati"','500 28px "Noto Sans Gujarati"',
    '600 28px "Noto Sans Gujarati"','700 28px "Noto Sans Gujarati"',
    '500 40px "Baloo Bhai 2"','600 40px "Baloo Bhai 2"',
    '700 40px "Baloo Bhai 2"','800 40px "Baloo Bhai 2"'
  ];
  try{
    await Promise.all(specs.map(f=>document.fonts.load(f, sampleText)));
    await document.fonts.ready;
  }catch(e){}
  // extra safety net for iOS Safari: poll until fonts truly report as loaded,
  // since fonts.ready can resolve slightly before glyphs are paint-ready there
  for(let i=0;i<20;i++){
    const allReady = specs.every(f=>document.fonts.check(f, sampleText));
    if(allReady) break;
    await new Promise(r=>setTimeout(r,80));
  }
}

let lastCanvas = null;

function formatDate(str){
  const d = new Date(str);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = d.getFullYear();
  return `${dd}-${mm}-${yy}`;
}

function standardLabel(std){
  const opt = [...standardSelect.options].find(o=>o.value===std);
  return opt ? opt.textContent.replace('ધોરણ ','') : std;
}

async function renderPost(data){
  const W = 1080;
  const logoImg = await loadImage(LOGO_SRC);
  await ensureFonts();

  // temp canvas for measuring
  const measureCanvas = document.createElement('canvas');
  measureCanvas.width = W; measureCanvas.height = 400;
  const mctx = measureCanvas.getContext('2d');

  const contentLeft = 74, contentRight = W-74, contentWidth = contentRight-contentLeft;

  // ---- measure table rows ----
  const colLeftW = Math.round(contentWidth*0.27);
  const colRightW = contentWidth - colLeftW;
  const cellPadX = 26, cellPadY = 20, lineH = 40;
  mctx.font = '400 30px "Noto Sans Gujarati"';
  const subjectRows = data.subjects.map(s=>{
    const lines = wrapText(mctx, s.text, colRightW - cellPadX*2);
    const h = Math.max(96, lines.length*lineH + cellPadY*2);
    return {...s, lines, h};
  });
  const tableH = subjectRows.reduce((a,r)=>a+r.h,0);

  // ---- measure note ----
  let noteLines = [], noteH = 0;
  if(data.note && data.note.trim()){
    mctx.font = '400 28px "Noto Sans Gujarati"';
    noteLines = wrapText(mctx, data.note.trim(), contentWidth - 140);
    noteH = Math.max(70, noteLines.length*36 + 40);
  }

  // ---- measure quote ----
  mctx.font = '600 30px "Noto Sans Gujarati"';
  const quoteLines = wrapText(mctx, data.quote, contentWidth - 200);
  const quoteH = quoteLines.length*42 + 70;

  // ---- compute total height ----
  const headerH = 210;
  const titleBarH = 100;
  const infoRowH = 86;
  const gap = 26;
  const footerH = 170;
  const topPad = 40, bottomPad = 40;

  const totalH = topPad + headerH + titleBarH + gap + infoRowH + gap
    + tableH + gap
    + (noteH ? noteH+gap : 0)
    + quoteH + gap
    + footerH + bottomPad;

  // ---- final canvas ----
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = Math.round(totalH);
  const ctx = canvas.getContext('2d');
  const H = canvas.height;

  // Border frame: solid gold edge-to-edge (no transparent corners), then inner cream rounded panel, then thin navy inline border
  ctx.fillStyle = '#c9a227';
  ctx.fillRect(0,0,W,H);

  const borderT = 22;
  roundRectPath(ctx, borderT, borderT, W-borderT*2, H-borderT*2, 30);
  ctx.fillStyle = '#0e2a52';
  ctx.fill();

  const innerT = borderT + 8;
  roundRectPath(ctx, innerT, innerT, W-innerT*2, H-innerT*2, 24);
  ctx.fillStyle = '#fffdf8';
  ctx.fill();

  let y = topPad;

  // ---- Header: logo (top-left, rounded square) + centered name/tagline ----
  const logoR = 82; // half-size of the logo box, kept for layout math elsewhere
  const logoBoxSize = logoR*2;
  const logoBoxX = contentLeft, logoBoxY = y+6;
  const logoCx = logoBoxX + logoBoxSize/2, logoCy = logoBoxY + logoBoxSize/2;
  const logoRadius = 22;
  roundRectPath(ctx, logoBoxX, logoBoxY, logoBoxSize, logoBoxSize, logoRadius);
  ctx.fillStyle = '#fff'; ctx.fill();
  ctx.save();
  roundRectPath(ctx, logoBoxX+4, logoBoxY+4, logoBoxSize-8, logoBoxSize-8, logoRadius-3);
  ctx.clip();
  // "contain" fit: whole logo visible and centered, since source image is
  // already trimmed + centered on a square canvas
  const iw = logoImg.width, ih = logoImg.height;
  const fitScale = ((logoBoxSize-8) / Math.max(iw,ih)) * 1.0;
  const dw = iw*fitScale, dh = ih*fitScale;
  ctx.drawImage(logoImg, logoCx-dw/2, logoCy-dh/2, dw, dh);
  ctx.restore();
  ctx.lineWidth = 4; ctx.strokeStyle = '#c9a227';
  roundRectPath(ctx, logoBoxX, logoBoxY, logoBoxSize, logoBoxSize, logoRadius);
  ctx.stroke();

  const titleCx = contentLeft + contentWidth/2;
  const maxNameW = Math.max(400, contentWidth - (logoR*2+60)*2);
  let nameFontSize = 56;
  ctx.font = `800 ${nameFontSize}px "Baloo Bhai 2"`;
  while(ctx.measureText(SCHOOL_NAME).width > maxNameW && nameFontSize>30){
    nameFontSize -= 2;
    ctx.font = `800 ${nameFontSize}px "Baloo Bhai 2"`;
  }
  ctx.fillStyle = '#0e2a52';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'center';
  ctx.fillText(SCHOOL_NAME, titleCx, logoCy - 4);

  // tagline as a small readable badge/pill
  function star(cx,cy,r,color){
    ctx.save();
    ctx.translate(cx,cy);
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a1 = -Math.PI/2 + i*(2*Math.PI/5);
      const a2 = a1 + Math.PI/5;
      const x1 = Math.cos(a1)*r, y1 = Math.sin(a1)*r;
      const x2 = Math.cos(a2)*r*0.42, y2 = Math.sin(a2)*r*0.42;
      if(i===0) ctx.moveTo(x1,y1); else ctx.lineTo(x1,y1);
      ctx.lineTo(x2,y2);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  ctx.font = '700 26px "Noto Sans Gujarati"';
  const tagW = ctx.measureText(SCHOOL_TAGLINE).width;
  const tagPadX = 26, starGap = 22;
  const tagPillW = tagW + tagPadX*2 + starGap*2 + 28;
  const tagPillH = 42;
  const tagPillX = titleCx - tagPillW/2, tagPillY = logoCy + 16;
  roundRectPath(ctx, tagPillX, tagPillY, tagPillW, tagPillH, tagPillH/2);
  ctx.fillStyle = '#fbf1d6'; ctx.fill();
  ctx.lineWidth = 1.6; ctx.strokeStyle = '#c9a227';
  roundRectPath(ctx, tagPillX, tagPillY, tagPillW, tagPillH, tagPillH/2); ctx.stroke();

  star(tagPillX+22, tagPillY+tagPillH/2, 9, '#c9a227');
  star(tagPillX+tagPillW-22, tagPillY+tagPillH/2, 9, '#c9a227');

  ctx.fillStyle = '#8a5a10';
  ctx.textBaseline = 'middle';
  ctx.fillText(SCHOOL_TAGLINE, titleCx, tagPillY+tagPillH/2+1);
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';

  y += headerH;

  // divider line under header
  ctx.strokeStyle = '#e3d8b0';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(contentLeft, y-30);
  ctx.lineTo(contentRight, y-30);
  ctx.stroke();

  // ---- Title pill "આજનું ગૃહકાર્ય" ----
  const pillTitle = 'આજનું ગૃહકાર્ય';
  ctx.font = '800 42px "Baloo Bhai 2"';
  const pillTextW = ctx.measureText(pillTitle).width;
  const pillW = Math.max(320, pillTextW + 90), pillH = 76;
  const pillX = W/2 - pillW/2, pillY = y + (titleBarH-pillH)/2;
  const midY = pillY + pillH/2;
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(contentLeft, midY); ctx.lineTo(pillX-18, midY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pillX+pillW+18, midY); ctx.lineTo(contentRight, midY); ctx.stroke();

  roundRectPath(ctx, pillX, pillY, pillW, pillH, 38);
  ctx.fillStyle = '#0e2a52'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = '#c9a227';
  roundRectPath(ctx, pillX, pillY, pillW, pillH, 38); ctx.stroke();

  ctx.font = '800 42px "Baloo Bhai 2"';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(pillTitle, W/2, pillY+pillH/2+2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';


  y += titleBarH + gap;

  // ---- Info row: date / day / standard ----
  const boxGap = 20;
  const boxW = (contentWidth - boxGap*2)/3;
  const boxY = y;
  const infoItems = [
    {icon:iconCalendar, label:'તારીખ', value: formatDate(data.date)},
    {icon:iconClock, label:'વાર', value: data.day},
    {icon:iconCap, label:'ધોરણ', value: standardLabel(data.standard)}
  ];
  infoItems.forEach((item,i)=>{
    const bx = contentLeft + i*(boxW+boxGap);
    roundRectPath(ctx, bx, boxY, boxW, infoRowH, 16);
    ctx.fillStyle = '#fbf8ef'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e3d8b0';
    roundRectPath(ctx, bx, boxY, boxW, infoRowH, 16); ctx.stroke();

    const iconCx = bx + 36, iconCy = boxY + infoRowH/2;
    ctx.beginPath(); ctx.arc(iconCx, iconCy, 22, 0, Math.PI*2);
    ctx.fillStyle = '#0e2a52'; ctx.fill();
    item.icon(ctx, iconCx, iconCy, 22, '#e8c96a');

    ctx.font = '600 16px "Noto Sans Gujarati"';
    ctx.fillStyle = '#8a8368';
    ctx.fillText(item.label, bx+68, boxY+34);
    ctx.font = '700 21px "Noto Sans Gujarati"';
    ctx.fillStyle = '#0e2a52';
    ctx.fillText(item.value, bx+68, boxY+60);
  });

  y += infoRowH + gap;

  // ---- Table ----
  const tableX = contentLeft, tableY = y, tableW = contentWidth;
  roundRectPath(ctx, tableX, tableY, tableW, tableH, 18);
  ctx.save(); ctx.clip();
  let rowY = tableY;
  subjectRows.forEach((row,i)=>{
    // left cell
    ctx.fillStyle = '#0e2a52';
    ctx.fillRect(tableX, rowY, colLeftW, row.h);
    // right cell
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(tableX+colLeftW, rowY, colRightW, row.h);

    // subject icon (small circle with icon matched to the subject)
    const iconCx = tableX+42, iconCy = rowY+row.h/2;
    ctx.beginPath(); ctx.arc(iconCx, iconCy, 24, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#e8c96a';
    ctx.beginPath(); ctx.arc(iconCx, iconCy, 24, 0, Math.PI*2); ctx.stroke();
    subjectIconFn(row.subject)(ctx, iconCx, iconCy, 24, '#e8c96a');

    const subjTextX = tableX+80;
    ctx.font = '700 28px "Noto Sans Gujarati"';
    ctx.fillStyle = '#fff';
    ctx.textBaseline = 'middle';
    const subjLines = wrapText(ctx, row.subject, colLeftW-96);
    const subjStartY = rowY + row.h/2 - (subjLines.length-1)*18;
    subjLines.forEach((ln,li)=>{
      ctx.fillText(ln, subjTextX, subjStartY + li*36);
    });

    ctx.font = '400 28px "Noto Sans Gujarati"';
    ctx.fillStyle = '#1c2a3a';
    const textStartY = rowY + cellPadY + 20;
    row.lines.forEach((ln,li)=>{
      ctx.fillText(ln, tableX+colLeftW+cellPadX, textStartY + li*lineH);
    });
    ctx.textBaseline = 'alphabetic';

    rowY += row.h;
    if(i < subjectRows.length-1){
      ctx.strokeStyle = '#e3d8b0'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(tableX, rowY); ctx.lineTo(tableX+tableW, rowY); ctx.stroke();
    }
  });
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = '#c9a227';
  roundRectPath(ctx, tableX, tableY, tableW, tableH, 18); ctx.stroke();

  y = tableY + tableH + gap;

  // ---- Note ----
  if(noteH){
    roundRectPath(ctx, contentLeft, y, contentWidth, noteH, 16);
    ctx.fillStyle = '#fdf3da'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#ecd99a';
    roundRectPath(ctx, contentLeft, y, contentWidth, noteH, 16); ctx.stroke();

    iconBell(ctx, contentLeft+40, y+noteH/2, 34, '#b8901f');

    ctx.font = '700 26px "Noto Sans Gujarati"';
    ctx.fillStyle = '#8a5a10';
    ctx.textBaseline = 'top';
    let ny = y + (noteH - noteLines.length*36)/2;
    ctx.fillText('નોંધ :', contentLeft+80, ny);
    const noteLabelW = ctx.measureText('નોંધ : ').width;
    ctx.font = '400 26px "Noto Sans Gujarati"';
    ctx.fillStyle = '#5a4415';
    noteLines.forEach((ln,li)=>{
      const xOff = li===0 ? contentLeft+80+noteLabelW : contentLeft+80;
      ctx.fillText(ln, xOff, ny + li*36);
    });
    ctx.textBaseline = 'alphabetic';
    y += noteH + gap;
  }

  // ---- Quote ----
  roundRectPath(ctx, contentLeft, y, contentWidth, quoteH, 20);
  ctx.fillStyle = '#0e2a52'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#c9a227';
  roundRectPath(ctx, contentLeft, y, contentWidth, quoteH, 20); ctx.stroke();

  ctx.font = '800 60px Georgia, serif';
  ctx.fillStyle = '#c9a227';
  ctx.fillText('“', contentLeft+24, y+58);

  ctx.font = '600 30px "Noto Sans Gujarati"';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  const qCenterX = W/2;
  let qy = y + (quoteH - quoteLines.length*42)/2 + 30;
  quoteLines.forEach((ln)=>{
    ctx.fillText(ln, qCenterX, qy);
    qy += 42;
  });
  ctx.textAlign = 'left';
  ctx.font = '800 60px Georgia, serif';
  ctx.fillStyle = '#c9a227';
  ctx.fillText('”', contentRight-52, y+quoteH-14);

  y += quoteH + gap;

  // ---- Footer ----
  const FOOTER_MOTTO = 'શિક્ષણ • સંસ્કાર • શિસ્ત • સફળતા';
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2;
  let footerFontSize = 32;
  ctx.font = `700 ${footerFontSize}px "Baloo Bhai 2"`;
  const maxFooterW = contentWidth - 120;
  while(ctx.measureText(FOOTER_MOTTO).width > maxFooterW && footerFontSize>18){
    footerFontSize -= 2;
    ctx.font = `700 ${footerFontSize}px "Baloo Bhai 2"`;
  }
  ctx.fillStyle = '#0e2a52';
  ctx.textAlign = 'center';
  const footY = y + footerH/2 - 16;
  const nameW = ctx.measureText(FOOTER_MOTTO).width;
  ctx.beginPath(); ctx.moveTo(contentLeft, footY); ctx.lineTo(W/2-nameW/2-24, footY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W/2+nameW/2+24, footY); ctx.lineTo(contentRight, footY); ctx.stroke();
  ctx.fillText(FOOTER_MOTTO, W/2, footY+12);

  // address + phone, small line below the motto
  const contactLine = `${SCHOOL_ADDRESS}   |   ${SCHOOL_PHONE}`;
  ctx.font = '500 21px "Noto Sans Gujarati"';
  ctx.fillStyle = '#7a7256';
  ctx.fillText(contactLine, W/2, footY + 42);
  ctx.textAlign = 'left';

  lastCanvas = canvas;
  return canvas;
}

/* ================= Actions ================= */
function collectData(){
  const subjects = [];
  document.querySelectorAll('.subject-row').forEach(row=>{
    const subj = row.querySelector('.subjectSelect').value;
    const text = row.querySelector('.subjectText').value.trim();
    if(subj && text) subjects.push({subject:subj, text});
  });
  return {
    standard: standardSelect.value,
    date: dateInput.value,
    day: dayDisplay.value,
    subjects,
    note: noteText.value,
    quote: quoteDisplay.textContent
  };
}

generateBtn.addEventListener('click', async ()=>{
  const data = collectData();
  if(!data.standard){ alert('કૃપા કરી ધોરણ પસંદ કરો.'); return; }
  if(!data.date){ alert('કૃપા કરી તારીખ પસંદ કરો.'); return; }
  if(data.subjects.length===0){ alert('ઓછામાં ઓછો એક વિષય અને તેનું ગૃહકાર્ય લખો.'); return; }

  overlay.classList.add('active');
  loadingMsg.style.display = 'block';
  previewImg.style.display = 'none';
  generateBtn.disabled = true;

  try{
    const canvas = await renderPost(data);
    previewImg.src = canvas.toDataURL('image/png');
    loadingMsg.style.display = 'none';
    previewImg.style.display = 'block';
  }catch(e){
    console.error(e);
    alert('પોસ્ટ બનાવવામાં ભૂલ આવી. ફરી પ્રયત્ન કરો.');
    overlay.classList.remove('active');
  }
  generateBtn.disabled = false;
});

editBtn.addEventListener('click', ()=>{ overlay.classList.remove('active'); });

downloadBtn.addEventListener('click', ()=>{
  if(!lastCanvas) return;
  const data = collectData();
  const stdLabel = standardLabel(data.standard).replace(/\s+/g,'');
  const filename = `Homework_${stdLabel}_${formatDate(data.date)}.png`;

  downloadBtn.disabled = true;
  const originalLabel = downloadBtn.textContent;
  downloadBtn.textContent = 'તૈયાર થાય છે...';

  lastCanvas.toBlob(async (blob)=>{
    downloadBtn.disabled = false;
    downloadBtn.textContent = originalLabel;
    if(!blob){
      alert('ડાઉનલોડ કરવામાં સમસ્યા આવી, ફરી પ્રયત્ન કરો.');
      return;
    }

    // Mobile phones (iOS/Android): use native share sheet so "Save Image" works
    try{
      const file = new File([blob], filename, {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: filename});
        return;
      }
    }catch(shareErr){
      if(shareErr && shareErr.name === 'AbortError') return; // user cancelled share
      // otherwise fall through to direct download below
    }

    // Desktop / browsers without share support: direct blob download
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(()=>URL.revokeObjectURL(url), 15000);
  }, 'image/png');
});

overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.classList.remove('active'); });
</script>
</body>
